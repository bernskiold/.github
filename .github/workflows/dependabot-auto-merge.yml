# Managed by configure-repos.sh
#
# Also reusable: other repos can call it from a `pull_request_target` workflow:
#   jobs:
#     auto-merge:
#       uses: bernskiold/.github/.github/workflows/dependabot-auto-merge.yml@main
#       permissions: { contents: write, pull-requests: write }
name: Dependabot Auto-Merge

on:
  pull_request_target:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch + minor updates only. Major bumps are left for review.
      - name: Enable auto-merge (patch + minor)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
