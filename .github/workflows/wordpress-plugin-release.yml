# Reusable release workflow for Bernskiold WordPress plugins.
#
# Call it from a `workflow_dispatch` workflow (see README.md). It releases the
# tip of the default branch as `version`:
#
#   1. check that `version` is valid semver, not tagged yet and greater than
#      the latest release
#   2. take the notes from a draft release for that tag, else the `notes`
#      input, else GitHub's generated notes
#   3. bump package.json, the plugin header and `version-files`, update
#      CHANGELOG.md, build, and make a single "Release x.y.z" commit
#   4. create an annotated tag on that commit and push branch + tag atomically
#      (never forced, so Packagist and Satis see the tag exactly once, on the
#      final commit)
#   5. build `<repo-name>.zip` and publish the release (the draft, if any)
#   6. optionally ask Satis to rebuild (`satis: true`)
#
# The caller must grant `permissions: contents: write` and pass
# `secrets: inherit` when `satis` is on.
name: WordPress Plugin Release

on:
    workflow_call:
        inputs:
            version:
                description: Version to release, semver without a leading "v" (e.g. 1.2.3 or 2.0.0-beta.1).
                type: string
                required: true
            notes:
                description: Release notes. Ignored when a draft release for the tag exists; empty means generated notes.
                type: string
                default: ''
            prerelease:
                description: Mark the GitHub release as a pre-release (CHANGELOG.md is not updated).
                type: boolean
                default: false
            build:
                description: Run `npm ci --ignore-scripts && npm run build` before committing.
                type: boolean
                default: true
            node-version:
                description: Node.js version used for the build.
                type: string
                default: '26'
            main-file:
                description: Main plugin file with the `Version:` header. Empty means `<repo-name>.php`.
                type: string
                default: ''
            version-files:
                description: Newline-separated files in which `version = '...'` is bumped.
                type: string
                default: 'src/Plugin.php'
            changelog:
                description: Prepend the release notes to CHANGELOG.md (if it exists) in the release commit. Skipped for pre-releases.
                type: boolean
                default: true
            composer:
                description: Run `composer install --no-dev --optimize-autoloader` and ship `vendor/` in the ZIP.
                type: boolean
                default: false
            satis:
                description: Ask packages.bernskiold.com to rebuild its Satis index after the release. Needs the caller to pass secrets with inherit.
                type: boolean
                default: false
        secrets:
            SATIS_DISPATCH_TOKEN:
                required: false

permissions:
    contents: write

jobs:
    release:
        name: Release ${{ inputs.version }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # One release per repository at a time; never cancel one half-way.
        concurrency:
            group: wordpress-plugin-release-${{ github.repository }}
            cancel-in-progress: false
        env:
            VERSION: ${{ inputs.version }}
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            SLUG: ${{ github.event.repository.name }}
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Checkout default branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 0
                  fetch-tags: true

            - name: Validate version
              id: check
              run: |
                  semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
                  if ! [[ "$VERSION" =~ $semver ]]; then
                      echo "::error::'$VERSION' is not a valid semver version (expected e.g. 1.2.3, without a leading v)."
                      exit 1
                  fi

                  for tag in "$VERSION" "v$VERSION"; do
                      if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
                          || [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
                          echo "::error::Tag $tag already exists. Tags are never moved; pick a new version."
                          exit 1
                      fi
                  done

                  # 404 when the repo has no published release yet.
                  if ! latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null)"; then
                      latest=""
                  fi
                  if [ -n "$latest" ]; then
                      python3 - "$VERSION" "${latest#v}" <<'PY'
                  import re, sys

                  def key(v):
                      m = re.match(r'^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?$', v)
                      if not m:
                          print(f"::error::Latest release '{v}' is not semver; cannot compare.")
                          sys.exit(1)
                      core = tuple(int(x) for x in m.group(1, 2, 3))
                      pre = m.group(4)
                      if pre is None:
                          return core, (1,)
                      ids = tuple((0, int(p), '') if p.isdigit() else (1, 0, p) for p in pre.split('.'))
                      return core, (0,) + ids

                  new, latest = sys.argv[1], sys.argv[2]
                  if key(new) <= key(latest):
                      print(f"::error::{new} is not greater than the latest release {latest}.")
                      sys.exit(1)
                  PY
                  fi
                  echo "previous=$latest" >> "$GITHUB_OUTPUT"

            - name: Resolve release notes
              id: notes
              env:
                  NOTES_INPUT: ${{ inputs.notes }}
                  PREVIOUS: ${{ steps.check.outputs.previous }}
              run: |
                  notes_file="$RUNNER_TEMP/release-notes.md"

                  # Draft releases don't create tags, so they are a safe place
                  # to write notes ahead of time.
                  draft="$(gh api "repos/$GH_REPO/releases" --paginate \
                      --jq ".[] | select(.draft and (.tag_name == \"$VERSION\" or .tag_name == \"v$VERSION\")) | .id" | head -n 1)"

                  if [ -n "$draft" ]; then
                      echo "Using the notes of draft release $draft."
                      gh api "repos/$GH_REPO/releases/$draft" --jq '.body // ""' > "$notes_file"
                  elif [ -n "$NOTES_INPUT" ]; then
                      echo "Using the notes input."
                      printf '%s\n' "$NOTES_INPUT" > "$notes_file"
                  else
                      echo "Generating release notes."
                      args=(-f tag_name="$VERSION" -f target_commitish="$DEFAULT_BRANCH")
                      [ -n "$PREVIOUS" ] && args+=(-f previous_tag_name="$PREVIOUS")
                      gh api -X POST "repos/$GH_REPO/releases/generate-notes" "${args[@]}" --jq .body > "$notes_file"
                  fi

                  {
                      echo "draft-id=$draft"
                      echo "file=$notes_file"
                      delimiter="NOTES_$(openssl rand -hex 16)"
                      echo "body<<$delimiter"
                      cat "$notes_file"
                      echo "$delimiter"
                  } >> "$GITHUB_OUTPUT"

            - name: Bump package.json
              if: ${{ hashFiles('package.json') != '' }}
              run: npm pkg set version="$VERSION"

            - name: Bump main plugin file
              env:
                  MAIN_FILE: ${{ inputs.main-file || format('{0}.php', github.event.repository.name) }}
              run: |
                  if [ ! -f "$MAIN_FILE" ]; then
                      echo "::error::Main plugin file '$MAIN_FILE' not found. Set the main-file input."
                      exit 1
                  fi
                  perl -pi -e 's/^([\s*]*Version:\s+).*$/${1}$ENV{VERSION}/' "$MAIN_FILE"
                  grep -Eq "^[[:space:]*]*Version:[[:space:]]+${VERSION//./\\.}\$" "$MAIN_FILE" \
                      || { echo "::error::No 'Version:' header was updated in $MAIN_FILE."; exit 1; }

            - name: Bump version in version files
              env:
                  VERSION_FILES: ${{ inputs.version-files }}
              run: |
                  while IFS= read -r file; do
                      file="$(echo "$file" | xargs)"
                      [ -z "$file" ] && continue
                      if [ ! -f "$file" ]; then
                          echo "::warning::Version file '$file' not found; skipping."
                          continue
                      fi
                      perl -pi -e "s/\bversion(\s*)=(\s*)'[^']*';/version\${1}=\${2}'\$ENV{VERSION}';/" "$file"
                      grep -q "'${VERSION}';" "$file" \
                          || echo "::warning::No \"version = '...'\" assignment found in $file."
                  done <<< "$VERSION_FILES"

            - name: Set up Node
              if: ${{ inputs.build }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: npm

            - name: Install NPM packages
              if: ${{ inputs.build }}
              run: npm ci --ignore-scripts

            - name: Build
              if: ${{ inputs.build }}
              run: npm run build

            - name: Update changelog
              if: ${{ inputs.changelog && !inputs.prerelease && hashFiles('CHANGELOG.md') != '' }}
              uses: stefanzweifel/changelog-updater-action@v1
              with:
                  latest-version: ${{ inputs.version }}
                  release-notes: ${{ steps.notes.outputs.body }}

            # One commit, one annotated tag on it, one atomic push. The tag is
            # created exactly once and never moved: Packagist (and Satis)
            # index a tag the first time they see it and refuse a retag.
            - name: Commit, tag and push
              id: commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit --allow-empty -q -m "Release $VERSION"
                  git tag -a "$VERSION" -m "Release $VERSION"
                  git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$VERSION"
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            # Runs after the commit so vendor/ is only ever shipped in the ZIP.
            - name: Set up PHP
              if: ${{ inputs.composer }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer
                  coverage: none

            - name: Install production Composer dependencies
              if: ${{ inputs.composer }}
              run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

            # Without Composer deps or a .distignore, the ZIP is a plain
            # `git archive` of the release commit. Otherwise the same archive
            # is extracted, vendor/ is added and .distignore (rsync patterns,
            # as used by `wp dist-archive`) is applied before zipping.
            - name: Create plugin ZIP
              env:
                  WITH_VENDOR: ${{ inputs.composer }}
              run: |
                  if [ "$WITH_VENDOR" != "true" ] && [ ! -f .distignore ]; then
                      git archive --format=zip --prefix="$SLUG/" -o "$SLUG.zip" HEAD
                      exit 0
                  fi

                  STAGE="$RUNNER_TEMP/plugin-zip"
                  rm -rf "$STAGE" && mkdir -p "$STAGE/archive/$SLUG" "$STAGE/dist"
                  git archive --format=tar HEAD | tar -x -C "$STAGE/archive/$SLUG"

                  if [ "$WITH_VENDOR" = "true" ]; then
                      rsync -a vendor/ "$STAGE/archive/$SLUG/vendor/"
                  fi

                  EXCLUDES=()
                  if [ -f .distignore ]; then
                      EXCLUDES=(--exclude-from="$PWD/.distignore")
                  fi
                  rsync -a "${EXCLUDES[@]}" "$STAGE/archive/$SLUG/" "$STAGE/dist/$SLUG/"

                  (cd "$STAGE/dist" && zip -qrX "$GITHUB_WORKSPACE/$SLUG.zip" "$SLUG")
                  unzip -l "$SLUG.zip" | tail -1

            - name: Publish GitHub release
              env:
                  DRAFT_ID: ${{ steps.notes.outputs.draft-id }}
                  NOTES_FILE: ${{ steps.notes.outputs.file }}
                  PRERELEASE: ${{ inputs.prerelease }}
              run: |
                  if [ -n "$DRAFT_ID" ]; then
                      # Point the draft at the new tag and publish it (title and
                      # notes are kept as written).
                      gh api -X PATCH "repos/$GH_REPO/releases/$DRAFT_ID" \
                          -f tag_name="$VERSION" \
                          -F draft=false \
                          -F prerelease="$PRERELEASE" >/dev/null
                      gh release upload "$VERSION" "$SLUG.zip" --clobber
                  else
                      flags=()
                      [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
                      gh release create "$VERSION" "$SLUG.zip" \
                          --verify-tag \
                          --title "$VERSION" \
                          --notes-file "$NOTES_FILE" \
                          "${flags[@]}"
                  fi
                  echo "### Released [$VERSION](${GITHUB_SERVER_URL}/${GH_REPO}/releases/tag/${VERSION})" >> "$GITHUB_STEP_SUMMARY"

    # The tag push and release above use GITHUB_TOKEN, which never triggers
    # the repo's own workflows (e.g. a notify-satis caller), so dispatch here.
    satis:
        name: Notify Satis
        needs: release
        if: ${{ inputs.satis }}
        permissions: {}
        uses: bernskiold/.github/.github/workflows/satis-notify.yml@main
        secrets: inherit
