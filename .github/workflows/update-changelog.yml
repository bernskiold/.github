# Prepends the release notes to CHANGELOG.md on the default branch when a
# release is published.
#
# Also reusable: other repos can call it from an `on: release: types: [released]`
# workflow:
#   jobs:
#     update:
#       uses: bernskiold/.github/.github/workflows/update-changelog.yml@main
#       permissions: { contents: write }
name: "Update Changelog"

on:
  release:
    types: [released]
  workflow_call:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.repository.default_branch }}
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
